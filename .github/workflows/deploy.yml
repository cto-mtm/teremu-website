name: Deploy website

# Trigger config lives here; the actual build/deploy is the reusable
# workflow in mtmcya-marketing (single source of truth for all sites).
on:
  push:
    branches: [main]
    paths:
      - "www/**"
      - "firebase.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # Prereqs (one-time):
    #  1. If mtmcya-marketing is private: in its Settings → Actions → General
    #     → "Access", allow this repo (or the whole org) to use its
    #     workflows.
    #  2. Add this repo's FIREBASE_SERVICE_ACCOUNT secret (Hosting deploy).
    #  3. Pin @main to a tag/SHA once you want change control over builds.
    uses: cto-mtm/mtmcya-marketing/.github/workflows/deploy-nuxt-site.yml@main
    secrets:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
